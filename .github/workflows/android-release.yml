name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building Speed Lock release: $TAG"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Integration Testbench (30 Tests)
        run: |
          echo "Running Python testbench verification..."
          python integration/x6871/tests/run_all_tests.py

      - name: Set up Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile and Run Java Unit Testbench (22 Tests)
        run: |
          echo "Running Java testbench verification..."
          mkdir -p speedlock-app/build/classes
          SOURCES=$(find speedlock-app/app/src/main/java -name "*.java" ! -name "MainActivity.java")
          TESTS=$(find speedlock-app/app/src/test/java -name "*.java")
          javac -d speedlock-app/build/classes $SOURCES $TESTS
          java -cp speedlock-app/build/classes io.speedlock.app.SpeedLockTestRunner

      - name: Verify Android SDK Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms

      - name: Cache Gradle Packages
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew Executable Permission
        run: chmod +x speedlock-app/gradlew

      - name: Configure Keystore Signing (if secrets present)
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing secret found. Decoding keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > speedlock-app/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No signing secret configured. Proceeding with dual build: unsigned release + signed debug."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble Release and Debug APKs
        run: |
          cd speedlock-app
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package, Verify Signatures & Checksums
        id: package
        run: |
          TAG="${{ steps.release_version.outputs.tag }}"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          RELEASE_DIR="speedlock-app/app/build/outputs/apk/release"
          DEBUG_DIR="speedlock-app/app/build/outputs/apk/debug"
          DIST_DIR="release_dist"
          mkdir -p "$DIST_DIR"

          # 1. Handle Release APK
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ -f "$RELEASE_DIR/app-release.apk" ]; then
            echo "Verifying signature on release APK..."
            $APKSIGNER verify --verbose "$RELEASE_DIR/app-release.apk"
            TARGET_RELEASE="SpeedLock-${TAG}-x6871.apk"
            cp "$RELEASE_DIR/app-release.apk" "$DIST_DIR/$TARGET_RELEASE"
            echo "release_signed=true" >> $GITHUB_OUTPUT
          else
            echo "Packaging release APK as explicitly unsigned..."
            TARGET_RELEASE="SpeedLock-${TAG}-x6871-unsigned.apk"
            if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
              cp "$RELEASE_DIR/app-release-unsigned.apk" "$DIST_DIR/$TARGET_RELEASE"
            elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
              cp "$RELEASE_DIR/app-release.apk" "$DIST_DIR/$TARGET_RELEASE"
            fi
            echo "release_signed=false" >> $GITHUB_OUTPUT
          fi

          # 2. Handle Debug-Signed Installable APK
          TARGET_DEBUG="SpeedLock-${TAG}-x6871-debug-installable.apk"
          cp "$DEBUG_DIR/app-debug.apk" "$DIST_DIR/$TARGET_DEBUG"
          echo "Verifying debug APK signature via apksigner..."
          $APKSIGNER verify --verbose "$DIST_DIR/$TARGET_DEBUG"

          # 3. Compute Checksums
          cd "$DIST_DIR"
          sha256sum "$TARGET_RELEASE" > "$TARGET_RELEASE.sha256"
          sha256sum "$TARGET_DEBUG" > "$TARGET_DEBUG.sha256"

          echo "RELEASE_FILE=$TARGET_RELEASE" >> $GITHUB_ENV
          echo "RELEASE_HASH=$(cat "$TARGET_RELEASE.sha256" | awk '{print $1}')" >> $GITHUB_ENV
          echo "DEBUG_FILE=$TARGET_DEBUG" >> $GITHUB_ENV
          echo "DEBUG_HASH=$(cat "$TARGET_DEBUG.sha256" | awk '{print $1}')" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ steps.release_version.outputs.tag }}"
          cat << EOF > RELEASE_NOTES.md
          ## Speed Lock Android Application — Release ${TAG}
          
          ### Target Device Profile
          - **Device**: Infinix GT 20 Pro (\`X6871\`)
          - **Commercial SoC**: MediaTek Dimensity 8200 Ultimate (\`MT6896\`)
          - **Silicon Platform / BSP**: \`MT6895\`
          - **Stock Kernel**: \`5.10.237-android12-9-00014-gf82f7360927e-ab14119954\`
          - **ABI**: \`arm64-v8a\` (64-bit only, Bionic libc)
          - **Page Size**: \`4096\` bytes (4 KB)
          
          ### Verified Integration Status
          - **DFRoot (CVE-2024-50302)**: Metadata compatible; prebuilt module CRC and vermagic rebuild required.
          - **GhostLock (CVE-2024-49854)**: Metadata compatible; MediaTek physical load offsets extraction required.
          - **DirtyInit**: Static audit only.
          - **UniRoot**: Static audit only.
          
          ### Automated Testbench Verification
          - **Python Integration Tests**: 30/30 PASSED
          - **Java App Regression Tests**: 22/22 PASSED
          - **Total Tests**: 52/52 (100% Success Rate)
          
          ### Downloadable Artifacts & Signatures
          - **Installable Package (Debug-Signed)**: \`${{ env.DEBUG_FILE }}\`
            - **Signature**: Android Debug Keystore (Verified via \`apksigner\` v1 + v2)
            - **Status**: Ready to sideload and install directly on Android devices.
            - **SHA-256**: \`${{ env.DEBUG_HASH }}\`
          
          - **Release Binary**: \`${{ env.RELEASE_FILE }}\`
            - **Status**: Unsigned release package for custom/OEM key signing.
            - **SHA-256**: \`${{ env.RELEASE_HASH }}\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: Speed Lock ${{ steps.release_version.outputs.tag }} (Infinix GT 20 Pro X6871)
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
